  <div class="wrapper">
    <h2 style="text-align: center; margin-top: 30px; font-size: 40px; color: rgb(187, 133, 237);">My Certifications</h2>
  <main class="certificates">
    <div class="card" onclick="openLightbox('HTML.png')">
      <img src="HTML.png" alt="HTML Certificate">
      <p>HTML Certificate</p>
    </div>
    <div class="card" onclick="openLightbox('CSS.png')">
      <img src="CSS.png" alt="CSS Certificate">
      <p>CSS Certificate</p>
    </div>
    <div class="card" onclick="openLightbox('Java Certificate.jpg')">
      <img src="Java Certificate.jpg" alt="Java Certificate">
      <p>Java Certificate</p>
    </div>
    <div class="card" onclick="openLightbox('WDes.png')">
      <img src="WDes.png" alt="Responsive Web Design Certificate">
      <p>Responsive Web Design Certificate</p>
    </div>
  </main>
   <footer>
    <div class="footer">
       &copy; 2025|| Made with <span style="color: red;">&#10084;</span>.
    </div>
    </div>
  </footer>
  </div>
    
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
  </div>
  <script>
  function openLightbox(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").style.display = "flex";
  }

  function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
  }
</script>
</body>
